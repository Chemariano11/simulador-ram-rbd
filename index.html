<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador RAM-RBD</title>
<meta name="description" content="Simulador RAM-RBD – simulação de eventos discretos para diagramas de blocos de confiabilidade, sistemas reparáveis e dados de campo. Instituto Weibull.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<title>Simulador RAM-RBD</title>
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#15201C; --ink-2:#44534E; --muted:#6A7873;
  --line:#D3DCD8; --line-2:#B9C5C0; --accent:#0B6B70; --accent-ink:#FFFFFF; --accent-soft:#D6EAEA;
  --good:#2C7A4B; --warn:#A96F12; --crit:#B23F2C; --good-soft:#DCEFE3; --warn-soft:#F6E8CF; --crit-soft:#F6DEDA;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1413; --surface:#151D1B; --surface-2:#1C2724; --ink:#E2E9E6; --ink-2:#B2C0BB; --muted:#8B9994;
    --line:#2A3733; --line-2:#3A4A45; --accent:#4DB2B4; --accent-ink:#04201F; --accent-soft:#16383A;
    --good:#5BBE86; --warn:#E3AA4A; --crit:#EC806C; --good-soft:#18332A; --warn-soft:#3A2E17; --crit-soft:#3D221D;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1413; --surface:#151D1B; --surface-2:#1C2724; --ink:#E2E9E6; --ink-2:#B2C0BB; --muted:#8B9994;
  --line:#2A3733; --line-2:#3A4A45; --accent:#4DB2B4; --accent-ink:#04201F; --accent-soft:#16383A;
  --good:#5BBE86; --warn:#E3AA4A; --crit:#EC806C; --good-soft:#18332A; --warn-soft:#3A2E17; --crit-soft:#3D221D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* topo */
@media (max-width:640px){.top{position:static!important}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){.top-in{padding-inline:16px}}
.brand-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-bottom:-1px}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);font:500 14px var(--f-body);
  padding:8px 14px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* controles */
button{font:500 13px var(--f-body);border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:4px 7px}
button.ghost:hover{background:var(--surface-2);color:var(--ink)}
button.danger:hover{border-color:var(--crit);color:var(--crit)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
textarea{font-family:var(--f-mono);font-size:13px;width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
label.f > span{font-weight:500}
label.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.unit{color:var(--muted);font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;align-items:end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.page{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.lead{color:var(--ink-2);max-width:78ch}
.hint{color:var(--muted);font-size:12.5px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.eyebrow{font:500 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.err{background:var(--crit-soft);color:var(--ink);border:1px solid var(--crit)}
.banner.info{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--f-body);letter-spacing:.03em;padding:1px 7px;border-radius:99px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.pm{background:var(--accent-soft);color:var(--ink)}
.chip.phm{background:var(--warn-soft);color:var(--ink)}
.chip.warnchip{background:var(--warn-soft);color:var(--ink);border-color:var(--warn)}
.chip.ccf{background:var(--crit-soft);color:var(--ink)}
/* estrutura */
.struct-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.node{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.node .node{background:var(--surface)}
.node-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.node-h select{font-weight:600}
.node-body{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px 16px;border-left:3px solid var(--accent-soft);margin:0 0 0 8px}
.node-h .sp{flex:1}
.blk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.blk .nm{font-weight:600;cursor:pointer;color:var(--ink);background:none;border:none;padding:0;font-size:14px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.blk .sum{color:var(--muted);font-size:12.5px;flex:1;min-width:180px}
.moves{display:inline-flex;gap:2px}
.diagram-box{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.diagram-box svg{display:block}
.dg-block rect{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.2}
.dg-block text{fill:var(--ink);font:500 12px var(--f-body)}
.dg-block .crit{fill:var(--crit)}
.dg-block .critbg{fill:var(--surface-2)}
.dg-line{stroke:var(--ink-2);stroke-width:1.2;fill:none}
.dg-lbl{fill:var(--muted);font:500 10.5px var(--f-mono)}
.dg-term{fill:var(--accent)}
/* componentes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column}
.card-h{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h input.name{font:600 15px var(--f-head);flex:1;min-width:140px;border-color:transparent;background:transparent;padding:3px 6px}
.card-h input.name:hover,.card-h input.name:focus{border-color:var(--line-2);background:var(--surface)}
.card-b{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.sub{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dist{display:flex;flex-direction:column;gap:6px}
.dist .dl{font-size:12px;font-weight:600;color:var(--ink-2)}
.dist .dm{font-size:12px;color:var(--muted)}
.dist .row{gap:8px}
.dist label.f{width:108px}
.dist label.f.wide{width:180px}
.dist label.f input{width:100%}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
/* tabelas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right}
tr.best td{background:var(--accent-soft)}
/* resultados */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .v{font:500 24px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart-card .cap{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.lc{position:relative}
.lc svg{width:100%;height:auto;display:block;overflow:visible}
.lc .ax{stroke:var(--line-2);stroke-width:1}
.lc .gr{stroke:var(--line);stroke-width:1}
.lc text{fill:var(--muted);font:11px var(--f-mono)}
.lc .xh{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 9px;font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-mono);font-weight:500}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-row .bl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1);min-width:1px}
.bar-row .bv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:64px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.progress > div{height:100%;width:0;background:var(--accent);transition:width .15s}
.status-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stale{opacity:.55}
.dlg{position:fixed;inset:0;background:rgba(10,16,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg > div{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:720px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 14px;border-radius:var(--r);font-size:13px;z-index:60;display:flex;gap:10px;align-items:center}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);padding:3px 9px}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.guide .panel p + p{margin-top:8px}
.guide ul{margin:6px 0 0;padding-left:18px}
.guide li{margin:3px 0}
.ok{color:var(--good);font-weight:600}
.no{color:var(--crit);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.memb{display:flex;flex-wrap:wrap;gap:6px 14px}
.tools label.f{max-width:100%}
#exampleSel,#skinSel{max-width:min(300px,62vw)}

/* temas escolhidos pelo usuário (vencem o tema do sistema) */
html:root[data-skin="claro-petroleo"]{color-scheme:light; --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#15201C; --ink-2:#44534E; --muted:#6A7873; --line:#D3DCD8; --line-2:#B9C5C0; --accent:#0B6B70; --accent-ink:#FFFFFF; --accent-soft:#D6EAEA; --good:#2C7A4B; --warn:#A96F12; --crit:#B23F2C; --good-soft:#DCEFE3; --warn-soft:#F6E8CF; --crit-soft:#F6DEDA; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;}
html:root[data-skin="claro-oceano"]{color-scheme:light; --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#E2E8F0; --ink:#121B2A; --ink-2:#3E4A5D; --muted:#637087; --line:#D0D8E4; --line-2:#B3BFD0; --accent:#1C5DAD; --accent-ink:#FFFFFF; --accent-soft:#DAE6F6; --good:#2C7A4B; --warn:#A96F12; --crit:#B23F2C; --good-soft:#DCEFE3; --warn-soft:#F6E8CF; --crit-soft:#F6DEDA; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;}
html:root[data-skin="claro-grafite"]{color-scheme:light; --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#E9E9E6; --ink:#1A1A19; --ink-2:#4A4A46; --muted:#6D6D68; --line:#D7D7D2; --line-2:#BBBBB5; --accent:#8F4F00; --accent-ink:#FFFFFF; --accent-soft:#F2E4D0; --good:#2C7A4B; --warn:#A96F12; --crit:#B23F2C; --good-soft:#DCEFE3; --warn-soft:#F6E8CF; --crit-soft:#F6DEDA; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;}
html:root[data-skin="escuro-petroleo"]{color-scheme:dark; --bg:#0E1413; --surface:#151D1B; --surface-2:#1C2724; --ink:#E2E9E6; --ink-2:#B2C0BB; --muted:#8B9994; --line:#2A3733; --line-2:#3A4A45; --accent:#4DB2B4; --accent-ink:#04201F; --accent-soft:#16383A; --good:#5BBE86; --warn:#E3AA4A; --crit:#EC806C; --good-soft:#18332A; --warn-soft:#3A2E17; --crit-soft:#3D221D; --s1:#3987e5; --s2:#d95926; --s3:#199e70;}
html:root[data-skin="escuro-grafite"]{color-scheme:dark; --bg:#111214; --surface:#1A1B1E; --surface-2:#24262A; --ink:#E9E9E6; --ink-2:#BDBDB8; --muted:#8E8E89; --line:#2E3034; --line-2:#3F4247; --accent:#F0A742; --accent-ink:#1A1205; --accent-soft:#3A2C14; --good:#5BBE86; --warn:#E3AA4A; --crit:#EC806C; --good-soft:#18332A; --warn-soft:#3A2E17; --crit-soft:#3D221D; --s1:#3987e5; --s2:#d95926; --s3:#199e70;}
html:root[data-skin="escuro-noite"]{color-scheme:dark; --bg:#0B1120; --surface:#121A2C; --surface-2:#1A2439; --ink:#E2E8F4; --ink-2:#B0BDD3; --muted:#8593AE; --line:#25304A; --line-2:#35425F; --accent:#7AAEFF; --accent-ink:#07142B; --accent-soft:#1B2D4F; --good:#5BBE86; --warn:#E3AA4A; --crit:#EC806C; --good-soft:#18332A; --warn-soft:#3A2E17; --crit-soft:#3D221D; --s1:#3987e5; --s2:#d95926; --s3:#199e70;}
.tip-pop{position:fixed;z-index:70;max-width:300px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.22);pointer-events:none}
.tip-pop::before{content:"";position:absolute;top:-5px;left:18px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.tab .info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);font:600 10px var(--f-body);color:var(--muted);margin-left:2px}
.tab:hover .info,.tab:focus-visible .info{border-color:var(--accent);color:var(--accent)}
tfoot td{border-top:2px solid var(--line-2);background:var(--surface-2)}
.credits{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
.dlg form{display:flex;flex-direction:column;gap:12px}
.dlg textarea.plain{font-family:var(--f-body);font-size:14px}
.relato{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.relato .meta{font-size:12px;color:var(--muted)}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand">
        <h1>Simulador RAM-RBD</h1>
        <small>Eventos discretos · Instituto Weibull</small>
      </div>
      <div class="tools">
        <label class="f" style="flex-direction:row;align-items:center;gap:6px"><span class="hint" style="font-weight:500">Modelo</span>
          <select id="exampleSel" aria-label="Novo modelo, meus modelos ou exemplo"></select></label>
        <button id="undoBtn" class="ghost" title="Desfazer a última alteração na estrutura" disabled>↶ Desfazer</button>
        <button id="myBtn" title="Salvar o modelo atual e abrir os modelos que você salvou">Meus modelos</button>
        <button id="jsonBtn">Modelo em JSON</button>
        <label class="f" style="flex-direction:row;align-items:center;gap:6px"><span class="hint" style="font-weight:500">Tema</span>
          <select id="skinSel" aria-label="Tema de cores">
            <option value="auto">Automático (sistema)</option>
            <optgroup label="Claros"><option value="claro-petroleo">Claro · Petróleo</option><option value="claro-oceano">Claro · Oceano</option><option value="claro-grafite">Claro · Grafite</option></optgroup>
            <optgroup label="Escuros"><option value="escuro-petroleo">Escuro · Petróleo</option><option value="escuro-grafite">Escuro · Grafite</option><option value="escuro-noite">Escuro · Noite</option></optgroup>
          </select></label>
        <button id="reportBtn" title="Relatar um erro, resultado estranho ou sugestão">⚑ Relatar problema</button>
      </div>

function RAMEngineFactory() {

  // {type:'fixed', value} | {type:'empirical', data:[...]} | {type:'uniform', a, b}

      -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

  // ---------- estrutura do RBD (multivalorada) ----------
  // nó: {type:'block', comp} | {type:'series'|'parallel'|'kofn'|'standby'|'loadshare', children:[...], k, mode, switch_p}

  //     {type:'paths', paths:[['A','C'],...]} caminhos mínimos / tie sets (legado; convertido em cortes na interface)
  function compsOf(n) {
    if (n.type === "block") return [n.comp];
    if (n.type === "paths") return [...new Set(n.paths.flat())];
    if (n.type === "cuts") return [...new Set(n.cuts.flat())];

  function perf(n, p, st) {

      case "standby": { const ss = st && st.get(n); if (ss && ss.blocked) return 0; let m = 0; for (const c of n.children) m = Math.max(m, perf(c, p, st)); return m; }

  /** Ritmo de envelhecimento de cada componente (0 = parado; 1 = operação nominal; outro valor = idade equivalente

    return w.map(Number);

      if (seen.has(n.comp)) throw new Error(`O componente "${n.comp}" aparece mais de uma vez no diagrama. Use a rede por caminhos mínimos para blocos repetidos.`);
      seen.add(n.comp); return;

      if (n.type === "cuts" && (!n.cuts || !n.cuts.length || n.cuts.some(c => !c.length))) throw new Error("Informe ao menos um conjunto mínimo de corte, sem conjuntos vazios.");
      if (n.type === "paths" && (!n.paths || !n.paths.length)) throw new Error("A rede por caminhos precisa de ao menos um caminho.");
      for (const x of compsOf(n)) {
        if (!comps[x]) throw new Error(`O conjunto de corte cita "${x}", que não é um componente.`);
        if (seen.has(x)) throw new Error(`O componente "${x}" aparece mais de uma vez no diagrama.`);

  class Heap {

  const COST_KEYS = ["corretiva", "preventiva", "preditiva", "inspecao", "mao_de_obra", "sobressalentes", "posse_estoque", "perda_producao"];
  const CNT_KEYS = ["falhas_comp", "CM", "PM", "CBM", "CBM_canceladas", "inspecoes", "choques_CCF", "falhas_evitadas", "demandas_comutacao", "falhas_comutacao", "falhas_ocultas", "testes_prova", "ocultas_reveladas_teste", "ocultas_reveladas_demanda"];

  function validateModel(m) {

    for (const c of m.components) {

        if (d.monitoring === "periodic" && !(d.inspect_interval > 0)) throw new Error(L + ": informe o intervalo entre inspeções.");
      } else validateDist(c.failure, L + " – distribuição de falha");
      if (c.repair) validateDist(c.repair, L + " – reparo");
      for (const [q, nm] of [[c.repair_q, "fator de restauração da corretiva"], [c.pm && c.pm.q, "fator de restauração da preventiva"]])

        if (!(c.hidden.test_interval > 0)) throw new Error(L + ": informe o intervalo entre testes de prova.");
        if (!["all", "dormant"].includes(c.hidden.mode || "all")) throw new Error(L + ": modo de falha oculta inválido.");

  // ============================================================================
  // Conjuntos mínimos de corte (Billinton & Allan, 1992, cap. 5 e 11)
  // ============================================================================
  const CUT_LIMIT = 20000;
  function minimize(sets) {

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const nf = (d) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
function fmt(x, d = 2) { if (x === Infinity) return "∞"; if (!isFinite(x)) return "—"; return nf(d).format(x); }
function fmtAuto(x) { if (!isFinite(x)) return x === Infinity ? "∞" : "—"; const a = Math.abs(x); if (a === 0) return "0";
  return a >= 1000 ? fmt(x, 0) : a >= 100 ? fmt(x, 1) : a >= 1 ? fmt(x, 2) : fmt(x, 4); }
function fmtH(x) { return (Math.abs(x) < 10 ? fmt(x, 2) : fmtAuto(x)) + " h"; }
function money(x) { return "R$ " + fmt(x, x >= 100 ? 0 : 2); }
function pct(x, d = 2) { return fmt(100 * x, d) + " %"; }

const DIST_TYPES = { exp: "Exponencial", weibull: "Weibull", lognormal: "Lognormal", normal: "Normal", fixed: "Fixo (determinístico)", uniform: "Uniforme", empirical: "Empírica (dados de campo)" };
function gamma1(x) { return Math.exp(lgam(x)); }
function lgam(x) { const g = 7, p = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgam(1 - x); x -= 1; let a = p[0]; const t = x + g + 0.5; for (let i = 1; i < 9; i++) a += p[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a); }
function distWithMean(type, m) {
  m = m > 0 ? m : 100;
  switch (type) {
    case "exp": return { type, mean: +m.toPrecision(4) };
    case "weibull": return { type, beta: 2, eta: +(m / gamma1(1.5)).toPrecision(4), gamma: 0 };
    case "lognormal": return { type, mu: Math.log(m / Math.exp(0.125)), sigma: 0.5 };
    case "normal": return { type, mu: +m.toPrecision(4), sigma: +(0.3 * m).toPrecision(3), truncated: true };
    case "fixed": return { type, value: +m.toPrecision(4) };
    case "uniform": return { type, a: +(0.5 * m).toPrecision(3), b: +(1.5 * m).toPrecision(3) };
    case "empirical": return { type, data: [+(0.6 * m).toPrecision(3), +m.toPrecision(3), +(1.4 * m).toPrecision(3)] };
  }
}
function distShort(d) {
  if (!d) return "—";
  switch (d.type) {
    case "exp": return `Exp. média ${fmtAuto(d.mean)} h`;
    case "weibull": return `Weibull β ${fmt(d.beta, 2)} η ${fmtAuto(d.eta)} h${d.gamma ? ` γ ${fmtAuto(d.gamma)} h` : ""}`;
    case "lognormal": return `Lognormal mediana ${fmtAuto(Math.exp(d.mu))} h σ ${fmt(d.sigma, 2)}`;
    case "normal": return `Normal µ ${fmtAuto(d.mu)} h σ ${fmtAuto(d.sigma)} h${d.truncated === false ? "" : " (truncada em 0)"}`;
    case "fixed": return `${fmtAuto(d.value)} h`;
    case "uniform": return `U(${fmtAuto(d.a)}; ${fmtAuto(d.b)}) h`;
    case "empirical": return `Empírica (${d.data.length} amostras)`;
  }
}
/** Editor de distribuição. get(): dist; set(dist) */
function distEditor(label, get, set, idBase) {
  const box = h("div", { class: "dist" });
  function field(key, lab, unit, val, onv, wide) {
    return h("label", { class: "f" + (wide ? " wide" : "") }, h("span", null, lab, unit ? h("span", { class: "unit" }, " (" + unit + ")") : null),
      h("input", { type: "number", step: "any", value: val, id: idBase + "-" + key, onchange: (e) => { onv(num(e.target.value, NaN)); changed(); } }));
  }
  function changed() { dm.textContent = meanText(); markStale(); save(); refreshSummaries(); }
  const dm = h("span", { class: "dm" });
  function meanText() { try { const m = E.distMean(get()); return isFinite(m) ? `média ≈ ${fmtAuto(m)} h` : ""; } catch (e) { return ""; } }
  function render() {
    box.innerHTML = ""; const d = get();
    const sel = h("select", { id: idBase + "-type", "aria-label": label + " – tipo", onchange: (e) => {
      let m = 100; try { m = E.distMean(get()); } catch (x) {} set(distWithMean(e.target.value, m)); render(); changed(); } },
      Object.entries(DIST_TYPES).map(([k, v]) => h("option", { value: k, selected: k === d.type }, v)));
    const params = h("div", { class: "row" });
    if (d.type === "exp") params.append(field("mean", "Média", "h", d.mean, v => d.mean = v));
    if (d.type === "weibull") params.append(field("beta", "β forma", "", d.beta, v => d.beta = v), field("eta", "η escala", "h", d.eta, v => d.eta = v), field("gamma", "γ local.", "h", d.gamma || 0, v => d.gamma = v));
    if (d.type === "lognormal") params.append(field("med", "Mediana", "h", +Math.exp(d.mu).toPrecision(5), v => d.mu = Math.log(v)), field("sigma", "σ (ln)", "", d.sigma, v => d.sigma = v));
    if (d.type === "normal") params.append(field("mu", "µ média", "h", d.mu, v => d.mu = v), field("sigma", "σ desvio", "h", d.sigma, v => d.sigma = v),
      h("label", { class: "chk", style: "align-self:center", title: "Truncada: a normal é condicionada a T > 0. Não truncada: a probabilidade P(T < 0) vira falha em t = 0, como nos cálculos de livro." },
        h("input", { type: "checkbox", id: idBase + "-trunc", checked: d.truncated !== false, onchange: (e) => { d.truncated = e.target.checked; changed(); } }), "truncada em t = 0"));
    if (d.type === "fixed") params.append(field("value", "Valor", "h", d.value, v => d.value = v));
    if (d.type === "uniform") params.append(field("a", "Mínimo", "h", d.a, v => d.a = v), field("b", "Máximo", "h", d.b, v => d.b = v));
    if (d.type === "empirical") params.append(h("label", { class: "f", style: "width:100%" }, h("span", null, "Amostras (h), separadas por ponto e vírgula ou espaço"),
      h("textarea", { rows: 2, id: idBase + "-data", onchange: (e) => { d.data = e.target.value.split(/[;\s]+/).map(s => num(s, NaN)).filter(isFinite); changed(); } }, d.data.join("; "))));
    dm.textContent = meanText();
    box.append(h("div", { class: "row", style: "justify-content:space-between;align-items:center" }, h("span", { class: "dl" }, label), dm), sel, params);
  }
  render(); return box;
}

const DC = { D: ["Disjuntor", 3.9954e-7, 0.45455], T6: ["6 terminais", 8.6988e-8, 0.26316], NB: ["No-break 675 kW", 4e-6, 0.125],

function dcModel(caso) {
  const comps = [], cnt = {};

    const name = `${nm}${suf ? " " + suf : ""}${["NB", "TR", "STS"].includes(t) ? "" : " " + cnt[t + suf]}`;
    comps.push({ name, failure: { type: "exp", mean: +(1 / lam).toPrecision(8) }, repair: { type: "exp", mean: +(1 / mu).toPrecision(6) }, pm: null, degradation: null, spare: null, logistic_delay: null, cm_cost: 0 });
    return { id: nid("b"), type: "block", comp: name }; };
  const ser = (ts, suf) => ({ id: nid("n"), type: "series", children: ts.split(" ").map(t => blk(t, suf)) });
  const CADEIA = "D T6 D T6 NB T6 D T6 D T6 TR T8 D T8 D";
  let structure, name;
  if (caso === 1) { structure = ser(CADEIA, ""); name = "Data center · Caso 1 (sem redundância)"; }
  if (caso === 2) { structure = { id: nid("n"), type: "series", children: [
      { id: nid("n"), type: "parallel", mode: "max", children: [ser("D T6 D T6 NB T6 D", "A"), ser("D T6 D T6 NB T6 D", "B")] },
      ser("STS D T6 D T6 TR T8 D T8 D", "")] }; name = "Data center · Caso 2 (no-break 1 de 2 + STS)"; }
  if (caso === 3) { structure = { id: nid("n"), type: "parallel", mode: "max", children: [ser(CADEIA, "A"), ser(CADEIA, "B")] }; name = "Data center · Caso 3 (sem ponto único de falha)"; }
  return { name, T: 8760, n_rep: 2000, seed: 1, up_threshold: 1e-9, crews: null, crew_cost_rate: 0, loss_rate: 0, components: comps, structure, spares: [], ccf: [] };
}

// ============================ worker ============================
let worker = null;
function getWorker() {
  if (worker) return worker;
  try {
    const src = RAMEngineFactory.toString() + `
const E = RAMEngineFactory();
onmessage = (ev) => { const { id, cmd, model, models } = ev.data;
  try {
    if (cmd === "run") { const r = E.simulate(model, p => postMessage({ id, progress: p })); postMessage({ id, done: true, result: r }); }
    else if (cmd === "sweep") { const out = []; models.forEach((m, i) => { out.push(E.simulate(m)); postMessage({ id, progress: (i + 1) / models.length }); }); postMessage({ id, done: true, result: out }); }
  } catch (e) { postMessage({ id, error: e.message }); } };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  } catch (e) { worker = null; }
  return worker;
}
let jobId = 0;
function runJob(cmd, payload, onProgress) {
  const w = getWorker(); const id = ++jobId;
  if (!w) return new Promise((res, rej) => setTimeout(() => { try {
    res(cmd === "run" ? E.simulate(payload.model, onProgress) : payload.models.map((m, i) => { const r = E.simulate(m); onProgress((i + 1) / payload.models.length); return r; }));
  } catch (e) { rej(e); } }, 30));
  return new Promise((res, rej) => {
    const fn = (ev) => { const d = ev.data; if (d.id !== id) return;
      if (d.progress !== undefined) onProgress(d.progress);
      if (d.done) { w.removeEventListener("message", fn); res(d.result); }
      if (d.error) { w.removeEventListener("message", fn); rej(new Error(d.error)); } };
    w.addEventListener("message", fn); w.postMessage({ id, cmd, ...payload });
  });
}

let tipEl = null, tipTimer = null;
function showTip(btn) {
  hideTip(); const t = btn.dataset.tip; if (!t) return;
  tipEl = h("div", { class: "tip-pop", role: "tooltip", id: "tabTip" }, t); document.body.append(tipEl);
  const r = btn.getBoundingClientRect(), w = tipEl.offsetWidth;
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + "px"; tipEl.style.top = (r.bottom + 8) + "px";
  btn.setAttribute("aria-describedby", "tabTip");

function hideTip() { clearTimeout(tipTimer); if (tipEl) { tipEl.remove(); tipEl = null; } document.querySelectorAll(".tab[aria-describedby]").forEach(b => b.removeAttribute("aria-describedby")); }
function wireTips() {
  document.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("mouseenter", () => { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(b), 350); });
    b.addEventListener("mouseleave", hideTip); b.addEventListener("blur", hideTip);
    b.addEventListener("focus", () => { if (b.matches(":focus-visible")) showTip(b); });
    b.querySelector(".info")?.addEventListener("click", (e) => { e.stopPropagation(); if (tipEl) hideTip(); else showTip(b); });

  document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", hideTip, { passive: true });
}

  const list = h("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:10px" });
  const panel = h("div", { class: "panel", id: "reportsPanel" }, h("div", { class: "sec-h" }, h("h3", null, "Relatos recebidos"),
    h("button", { onclick: () => loadReports(list) }, "Carregar relatos")), h("p", { class: "hint" }, "Visível apenas para quem edita esta página."), list);
  pg.append(panel);
}
async function loadReports(list) {
  list.innerHTML = ""; const db = await getDb();
  if (!db) { list.append(h("p", { class: "hint" }, "O armazenamento de relatos não está disponível nesta visualização.")); return; }
  try {
    const snap = await db.collection("relatos").orderBy("criado_em", "desc").limit(200).get();
    if (snap.empty) { list.append(h("p", { class: "hint" }, "Nenhum relato até agora.")); return; }
    snap.docs.forEach(d => { const r = d.data() || {};
      const st = h("span", { class: "chip " + (r.status === "resolvido" ? "pm" : "ccf") }, r.status || "novo");
      list.append(h("div", { class: "relato" },
        h("div", { class: "row", style: "justify-content:space-between;align-items:center" }, h("strong", null, (r.tipo || "Relato") + " · " + (r.aba || "")), st),
        h("div", { class: "meta" }, `${(r.criado_em || "").replace("T", " ").slice(0, 16)} · versão ${r.versao || "?"}${r.contato ? " · " + r.contato : ""}`),
        h("div", null, r.descricao || ""), r.passos ? h("div", { class: "hint" }, "Passos: " + r.passos) : null,
        h("div", { class: "row" }, r.modelo ? h("button", { class: "ghost", onclick: () => showText("Modelo anexado ao relato", r.modelo) }, "Ver modelo anexado") : null,
          r.status !== "resolvido" ? h("button", { class: "ghost", onclick: async (e) => { e.target.disabled = true;
            try { await db.doc("relatos/" + d.id).update({ status: "resolvido" }); st.textContent = "resolvido"; st.className = "chip pm"; e.target.remove(); } catch (err) { e.target.disabled = false; toast("Não foi possível atualizar: " + (err.message || err.code)); } } }, "Marcar como resolvido") : null)));
    });
  } catch (e) { list.append(h("p", { class: "hint" }, "Não foi possível ler os relatos: " + (e.message || e.code))); }
}


// ============================ novo modelo e meus modelos ============================
function blankModel() {
  return { name: "Meu sistema", T: 8760, n_rep: 200, seed: 1, up_threshold: 1e-9, crews: null, crew_cost_rate: 0, loss_rate: 0,
    components: [newComp("C 1"), newComp("C 2")],
    structure: { id: nid("n"), type: "series", children: [{ id: nid("b"), type: "block", comp: "C 1" }, { id: nid("b"), type: "block", comp: "C 2" }] },
    spares: [], ccf: [] };
}
const MY_KEY = "ramrbd.meusmodelos.v1";
function readMy() { try { return JSON.parse(localStorage.getItem(MY_KEY) || "{}") || {}; } catch (e) { return {}; } }
function writeMy(o) { try { localStorage.setItem(MY_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function fillModelSelect() {
  const sel = $("#exampleSel"); sel.innerHTML = "";
  const my = readMy(); const names = Object.keys(my).sort((a, b) => a.localeCompare(b, "pt-BR"));
  sel.append(h("option", { value: "" }, "Escolher modelo…"),
    h("optgroup", { label: "Começar" }, h("option", { value: "__novo" }, "Novo modelo (definido pelo usuário)")),
    names.length ? h("optgroup", { label: "Meus modelos" }, names.map(n => h("option", { value: "__meu:" + n }, n))) : null,
    h("optgroup", { label: "Exemplos" }, EX_LIST.map(([k, l]) => h("option", { value: k }, l))));
}
function openMyModel(name) {
  const my = readMy(); if (!my[name]) { toast("Modelo não encontrado neste navegador."); return; }
  snapshot(); model = clone(my[name].model); ensureIds(model.structure); results = null; resultsStale = false; save(); renderAll();
  toast("Modelo aberto: " + name, { label: "Desfazer", fn: undo });
}
function myModelsDialog() {
  const root = $("#dlgRoot"); root.innerHTML = ""; if (typeof hideTip === "function") hideTip();
  const close = () => root.innerHTML = "";
  const nameIn = h("input", { id: "myName", value: model.name || "Meu sistema", style: "flex:1;min-width:200px" });
  const list = h("div", { style: "display:flex;flex-direction:column;gap:6px" });
  function renderList() {
    list.innerHTML = ""; const my = readMy(); const names = Object.keys(my).sort((a, b) => a.localeCompare(b, "pt-BR"));
    if (!names.length) { list.append(h("p", { class: "hint" }, "Nenhum modelo salvo neste navegador ainda.")); return; }
    names.forEach(n => {
      const when = my[n].salvo_em ? new Date(my[n].salvo_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
      const del = h("button", { class: "ghost danger", onclick: () => {
        if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "Confirmar exclusão"; setTimeout(() => { if (del.isConnected) { del.dataset.confirm = ""; del.textContent = "Excluir"; } }, 4000); return; }
        const o = readMy(); delete o[n]; writeMy(o); fillModelSelect(); renderList(); toast("Modelo excluído: " + n); } }, "Excluir");
      list.append(h("div", { class: "relato", style: "flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px" },
        h("div", null, h("strong", null, n), h("div", { class: "meta" }, `${my[n].model.components.length} componentes · salvo em ${when}`)),
        h("div", { class: "row" }, h("button", { onclick: () => { close(); openMyModel(n); } }, "Abrir"), del)));
    });
  }
  const d = h("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-label": "Meus modelos", onclick: e => { if (e.target === d) close(); } },
    h("div", null, h("div", { class: "sec-h" }, h("h3", null, "Meus modelos"), h("button", { class: "ghost", onclick: close, "aria-label": "Fechar" }, "✕")),
      h("p", { class: "hint" }, "Os modelos ficam guardados neste navegador, neste computador. Para levar um modelo a outro computador ou entregá-lo ao professor, use Modelo em JSON."),
      h("div", { class: "row", style: "align-items:flex-end" }, h("label", { class: "f", style: "flex:1;min-width:200px" }, h("span", null, "Salvar o modelo atual como"), nameIn),
        h("button", { class: "primary", onclick: () => {
          const n = nameIn.value.trim(); if (!n) { toast("Informe um nome para o modelo."); nameIn.focus(); return; }
          const o = readMy(); const existed = !!o[n]; const m = clone(model); m.name = n; o[n] = { salvo_em: new Date().toISOString(), model: m };
          if (!writeMy(o)) { toast("Não foi possível salvar neste navegador (armazenamento bloqueado ou cheio)."); return; }
          model.name = n; save(); fillModelSelect(); renderList(); if (curTab === "estrutura") renderStructure();
          toast(existed ? "Modelo atualizado: " + n : "Modelo salvo: " + n); } }, "Salvar")),
      h("h3", { style: "margin-top:6px" }, "Modelos salvos"), list));
  root.append(d); renderList(); nameIn.focus(); nameIn.select();
}

// ============================ inicialização ============================
function init() {
  load();
  const sel = $("#exampleSel");
  fillModelSelect();
  sel.addEventListener("change", e => { const k = e.target.value; if (!k) return; e.target.value = "";
    if (k === "__novo") { snapshot(); model = blankModel(); ensureIds(model.structure); results = null; resultsStale = false; save(); showTab("estrutura");
      setTimeout(() => { const n = $("#modelName"); if (n) { n.focus(); n.select(); } }, 50);
      toast("Novo modelo criado. Dê um nome e monte a estrutura.", { label: "Desfazer", fn: undo }); return; }
    if (k.startsWith("__meu:")) { openMyModel(k.slice(6)); return; }
    snapshot(); model = EX[k](); ensureIds(model.structure); results = null; resultsStale = false; save(); renderAll();
    toast("Exemplo carregado: " + model.name, { label: "Desfazer", fn: undo }); });
  $("#undoBtn").addEventListener("click", undo);
  $("#jsonBtn").addEventListener("click", jsonDialog);
  $("#myBtn").addEventListener("click", myModelsDialog);
  $("#reportBtn").addEventListener("click", reportDialog);
  let sk = "auto"; try { sk = localStorage.getItem("ramrbd.skin") || "auto"; } catch (e) {}
  $("#skinSel").value = sk; applySkin(sk); $("#skinSel").addEventListener("change", e => { applySkin(e.target.value); toast("Tema aplicado."); });
  wireTips();
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  let t = "estrutura"; try { t = localStorage.getItem("ramrbd.tab") || "estrutura"; } catch (e) {}
  if (location.hash && document.getElementById("tab-" + location.hash.slice(1))) t = location.hash.slice(1);
  showTab(t);
}
init();
</script>
